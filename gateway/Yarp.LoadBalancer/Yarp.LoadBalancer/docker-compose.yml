version: '3'

services:
  mongodb:
    image: mongo:latest
    container_name: mongodb    
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admin
    volumes:
      - C:\datavolume:/data/db
    networks:
      - mongo-net
    ports:
      - "27017:27017"
          
networks:
  mongo-net:
    driver: bridge
